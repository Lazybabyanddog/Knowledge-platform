# 发布入口：唯一对外服务。
# 两个切换点（API 指向、前端版本目录）都在 conf.d/active.conf 里，
# 发布脚本一次重写该文件 + reload，不重启容器、不断开已建立连接。
worker_processes auto;
error_log /var/log/nginx/error.log warn;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    sendfile on;
    tcp_nopush on;
    keepalive_timeout 65;
    server_tokens off;

    access_log /var/log/nginx/access.log;

    # Docker 内置 DNS：配合变量形式的 proxy_pass，颜色容器还没起时网关也能正常启动
    resolver 127.0.0.11 valid=10s ipv6=off;

    # active.conf 在这里定义 $api_upstream 与 $frontend_root。
    # 挂载的是目录而不是单个文件：脚本用 rename 原子替换，单文件挂载看不到新 inode。
    include /etc/nginx/conf.d/*.conf;

    server {
        listen 80;
        server_name _;

        # 前端版本目录，取值来自 active.conf 的 map
        root $frontend_root;

        # 入口 HTML 不能缓存：否则切流后用户仍拿旧页面去请求已被淘汰的资源
        location = /index.html {
            add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        }

        # 文件名带内容哈希，可以长缓存；旧版本目录保留，已打开的页面照样能加载
        location /assets/ {
            try_files $uri =404;
            expires 1y;
            add_header Cache-Control "public, immutable" always;
        }

        location / {
            try_files $uri $uri/ /index.html;
        }

        # API：SSE 必须关闭缓冲，否则事件会被 nginx 攒住
        location /api/ {
            # 变量形式才会走 resolver：换颜色不需要 reload 后重新解析 upstream
            proxy_pass http://$api_upstream;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Connection "";

            proxy_buffering off;
            proxy_cache off;
            # 问答流可能持续很久，读超时要盖住后端最长的生成时间
            proxy_read_timeout 3900s;
            proxy_send_timeout 60s;

            # 与后端 UPLOAD_MAX_SIZE_MB 对齐
            client_max_body_size 200m;
        }

        # 网关自身存活探针：不依赖上游
        location = /nginx-health {
            access_log off;
            return 200 "ok\n";
        }

        # 当前颜色的健康端点：发布/回滚脚本据此确认"流量真的落到了目标颜色"
        # 直通当前上游而不是固定某一色，切流后无需改脚本
        location = /healthz {
            access_log off;
            proxy_pass http://$api_upstream/healthz;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header Connection "";
        }
    }
}
